<style>
:root{--bg:#f7f9fc;--card:#fff;--line:#e8edf5;--ink:#0f172a;--mut:#64748b;--blue:#2d5be3;--teal:#3fa9cc;--acc:#2d5be3;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',Tajawal,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-tap-highlight-color:transparent}
svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:560px;margin:0 auto;padding-bottom:104px}
main.page{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 120px}
h2{font-size:1.2rem;margin:0 0 12px;font-weight:700}
p{margin:.4em 0;color:var(--mut)}
a.back{display:inline-block;color:var(--mut);text-decoration:none;margin-bottom:10px;font-weight:500}
.head{padding:calc(16px + env(safe-area-inset-top,0px)) 18px 24px;background:radial-gradient(#c5d1e6 1.1px,transparent 1.2px) 0 0/24px 24px,linear-gradient(#eef3ff,#fbfcff);border-radius:0 0 38px 38px;box-shadow:0 10px 30px rgba(45,91,227,.07)}
.bar{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.lg{width:56px;height:56px;border-radius:16px;box-shadow:0 8px 18px rgba(9,22,44,.3);display:block}
.lg svg{width:28px;height:28px}
.brand b{font-size:1.5rem;font-weight:700;display:block;line-height:1.15}
.brand small{color:var(--blue);font-weight:600;font-size:.7rem;letter-spacing:.6px}
.ibs{display:flex;gap:10px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:#eaf0f8;display:grid;place-items:center;cursor:pointer;color:#334155}
.ib svg{width:22px;height:22px}
.center{text-align:center}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:22px;background:#f4f7ff;border:1px solid #dbe5fb;color:var(--blue);padding:8px 16px;border-radius:99px;font-size:.88rem;font-weight:500}
.badge svg{width:18px;height:18px}
h1{text-align:center;font-size:2.1rem;font-weight:700;margin:16px 0 6px;line-height:1.3}
.sub{text-align:center;color:#475569;margin:0 0 22px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#2d5be3,#4fb0d0);color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;padding:16px;border-radius:20px;box-shadow:0 12px 24px rgba(45,91,227,.28)}
.cta svg{width:22px;height:22px}
.inst{display:none;margin:12px auto 0;background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer}
.sh{display:flex;justify-content:space-between;align-items:center;margin:26px 18px 12px}
.sh h2{margin:0;display:flex;gap:8px;align-items:center}
.sh h2 svg{width:24px;height:24px;color:var(--blue)}
.sh span,.sh .more{color:var(--mut);font-size:.85rem;text-decoration:none}.sh .more{color:var(--blue);font-weight:500}
.rc2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(15,23,42,.05)}
.chip{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#eaf1ff;color:var(--blue)}
.chip svg{width:26px;height:26px}
.rc.t .chip{background:#e6f8fc;color:var(--teal)}
.rc b{display:block;margin-top:22px;font-size:1.1rem;font-weight:700}
.rc p{font-size:.84rem;margin:4px 0 12px;line-height:1.6}
.rc em{font-style:normal;font-weight:600;color:var(--blue);font-size:.92rem}.rc.t em{color:var(--teal)}
.adm{margin:14px 18px 0;display:flex;align-items:center;gap:14px;background:#111827;color:#fff;border-radius:24px;padding:18px;text-decoration:none;box-shadow:0 12px 24px rgba(15,23,42,.2)}
.adm .chip{background:#1f2937;color:#4cc3e0;width:56px;height:56px}
.adm .tx{flex:1}.adm b{display:block;font-size:1.08rem}.adm p{color:#9ca3af;font-size:.82rem;margin:2px 0 0}
.adm .go2{width:44px;height:44px;border-radius:50%;background:#1f2937;display:grid;place-items:center}
.aib{margin:16px 18px 0;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#43399a,#2f62e0 55%,#3a7b99);color:#fff;border-radius:24px;padding:18px;text-decoration:none;box-shadow:0 12px 24px rgba(47,98,224,.25)}
.aib .chip{background:rgba(255,255,255,.18);color:#fcd34d}
.aib .tx{flex:1}.aib .tt{display:flex;align-items:center;gap:8px;font-weight:700}
.aib em{font-style:normal;background:#f6c945;color:#111827;border-radius:8px;padding:0 10px;font-size:.78rem}
.aib p{color:#dbe4ff;font-size:.84rem;margin:2px 0 0}
.aib .try{background:#fff;color:var(--blue);font-weight:700;padding:9px 18px;border-radius:14px}
.sv{display:flex;gap:12px;overflow-x:auto;padding:0 18px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.sv::-webkit-scrollbar{display:none}
.sc{flex:none;width:152px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 10px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(15,23,42,.04)}
.sc i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}
.sc i svg{width:28px;height:28px}
.sc b{display:block;font-size:.98rem}.sc span{color:var(--mut);font-size:.78rem;line-height:1.4;display:block}
.st{margin:18px;background:#eff3f9;border:1px solid var(--line);border-radius:22px;padding:16px 0}
.st div{flex:1;text-align:center}.st div+div{border-right:1px solid var(--line)}
.st b{display:block;font-size:1.35rem;font-weight:700}.st span{color:var(--mut);font-size:.85rem}
.faq{padding:0 18px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:10px}
summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin:0 0 14px;font-size:.92rem}
.foot{margin:26px 18px 0;padding:18px 0 4px;border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:.85rem}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
nav#nav{position:fixed;bottom:0;left:0;right:0;height:80px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:0 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 -8px 24px rgba(15,23,42,.06)}
nav a{flex:1;text-align:center;text-decoration:none;color:#94a3b8;font-size:.74rem;font-weight:500}
nav a svg{display:block;margin:0 auto 3px;width:26px;height:26px}
nav a.on,nav a.ai{color:var(--blue)}
nav a.fab{margin-top:-34px;color:var(--ink)}
nav .c{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#2d6bf0,#46aed0);margin:0 auto 4px;border:5px solid #fff;box-shadow:0 8px 20px rgba(45,91,227,.4);color:#fff}
nav .c svg{width:30px;height:30px;margin:0}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:20}
.btn{text-align:center;text-decoration:none;font-weight:600;padding:14px 12px;border-radius:14px;display:block}
.btn.p{background:linear-gradient(90deg,#2d5be3,#4fb0d0);color:#fff}
.btn.g{border:1.5px solid var(--line);color:var(--ink);background:#fff}
.btn.wide{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 18px rgba(15,23,42,.04)}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:#f8fafd;color:var(--ink)}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.go{margin-top:20px;width:100%;font:inherit;font-weight:700;font-size:1.02rem;padding:14px;border:0;border-radius:16px;background:linear-gradient(90deg,#2d5be3,#4fb0d0);color:#fff;cursor:pointer}
button.go:disabled{opacity:.6}
.msg{padding:12px;border-radius:12px;margin-top:14px;font-weight:600}
.msg.ok{background:#e6f4ea;color:#1e6b2f}.msg.err{background:#fde8e8;color:#a61e1e}
.row{border-top:1px dashed var(--line);padding:12px 0}.row:first-child{border-top:0}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:0 10px;font-size:.8rem}
.warn{background:#eef3ff;color:#1e3a8a;border:1px solid #cfdcfb;border-radius:10px;padding:10px;font-size:.88rem}
.tabs{display:flex;gap:8px;margin:6px 0}
.tabs button{flex:1;font:inherit;font-weight:600;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.cnt{margin-top:8px;padding:10px 12px;border-radius:12px;background:#f1f5f9;color:var(--mut);font-size:.86rem}
.cnt.ok{background:#e6edfb;color:#1d4ed8;font-weight:600}
.done{text-align:center;padding:30px 20px}
.tick{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#2d5be3,#46aed0);margin:0 auto 14px;display:grid;place-items:center;color:#fff}
.tick svg{width:38px;height:38px;stroke-width:3}
.chat{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
.chat-h{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.chat-h i{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#43399a,#2f62e0);display:grid;place-items:center;color:#fff}
.chat-h svg{width:24px;height:24px}
.chat-h b{display:block}.chat-h span{color:var(--mut);font-size:.82rem}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.m{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.7;font-size:.95rem;white-space:pre-wrap}
.m.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-right-radius:6px}
.m.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-left-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chips button{font:inherit;font-size:.84rem;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cform{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.cform input{flex:1}
.cform button{width:50px;border:0;border-radius:14px;background:var(--blue);cursor:pointer;display:grid;place-items:center;color:#fff}
.cform svg{width:22px;height:22px;transform:scaleX(-1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>*{animation:rise .4s ease both}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
.asst{margin:14px 18px 0;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ecfdf5,#eefbfd);border:1px solid #cfeee6;border-radius:24px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(15,23,42,.04)}
.asst .tx{flex:1}.asst b{display:block;font-size:1.12rem;font-weight:700}
.asst p{font-size:.84rem;margin:4px 0 8px;line-height:1.6}
.asst em{font-style:normal;font-weight:600;color:#0f9d8a;font-size:.92rem}
.asst .ill{width:96px;height:96px;flex:none;border-radius:22px;object-fit:cover}
</style>
</head>

let statsP;
const statsOnce = () => statsP || (statsP = db.collection("stats").doc("active").get().then(d => d.exists ? d.data() : {}).catch(() => ({})));

const SKILLS = ["مساعد مساحة", "رودمان", "مشغّل أجهزة", "مساعد أعمال إنشاءات"];
function assistantForm() {
  app.innerHTML = `<a class="back" href="#">رجوع</a><h2>انضم كمساعد مساحة</h2>
    <form class="card" id="af">
      <label>الاسم</label><input name="name" required>
      <label>رقم الموبايل</label><input name="phone" type="tel" inputmode="tel" required placeholder="01xxxxxxxxx">
      <label>المحافظة</label><select name="gov">${opts(GOVS)}</select>
      <label>التخصص</label><select name="skill">${opts(SKILLS)}</select>
      <label>سنين الخبرة</label><input name="years" type="number" min="0" max="50" inputmode="numeric" required>
      <label>نبذة عن خبرتك</label><textarea name="notes"></textarea>
      <button class="go" type="submit">سجّل بياناتي</button><div id="ao"></div>
    </form>`;
  document.getElementById("af").onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector("button"), out = document.getElementById("ao");
    const data = Object.fromEntries(new FormData(ev.target));
    btn.disabled = true; btn.textContent = "جاري الإرسال...";
    try {
      await db.collection("assistants").add({ ...data, status: "new", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      ev.target.outerHTML = `<div class="card done"><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>تم تسجيلك</h2><p>هنتواصل معاك لما تتوفر فرصة عمل مناسبة في محافظتك.</p><a class="btn g wide" href="#">رجوع للرئيسية</a></div>`;
    } catch (e) {
      out.className = "msg err"; out.textContent = "حصلت مشكلة في الإرسال. تأكد من النت وجرب تاني."; console.error(e);
      btn.disabled = false; btn.textContent = "سجّل بياناتي";
    }
  };
}

function toast(t) { const e = el("div", { class: "toast" }, t); document.body.append(e); setTimeout(() => e.remove(), 1800); }

async function save(client, data) {
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  if (client) {
    const ref = db.collection("requests").doc(), b = db.batch();
    b.set(ref, { ...data, status: "new", createdAt: ts });
    b.set(db.collection("board").doc(ref.id), { service: data.service, gov: data.gov, status: "open", createdAt: ts });
    await b.commit();
  } else {
    const { email, pw, ...rest } = data;
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await db.collection("surveyors").doc(cred.user.uid).set({ ...rest, status: "new", createdAt: ts });
  }
}

function done(client, data) {
  const t = client ? `طلب أخصائي مساحة جديد من ${data.name} - ${data.service} - ${data.gov}` : `تسجيل أخصائي مساحة جديد: ${data.name} - ${data.spec} - ${data.gov}`;
  document.getElementById("f").outerHTML = `<div class="card done">
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>${client ? "وصل طلبك" : "تم تسجيلك"}</h2>
    <p>${client ? "هنتواصل معاك على رقم الموبايل اللي كتبته." : "تم إنشاء حسابك. هنراجع بياناتك ونعتمد الحساب، وبعدها تقدر تشوف الطلبات."}</p>
    ${WA_NUMBER ? `<a class="btn p wide" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">كمّل على واتساب</a>` : ""}

    <a class="btn g wide" href="#">رجوع للرئيسية</a></div>`;
}

const AI_ENDPOINT = "";
const KB = [
  [["توتال", "total"], "التوتال ستيشن جهاز يقيس الزوايا والمسافات إلكترونياً ويحسب إحداثيات النقاط، ويُستخدم في الرفع المساحي والتوقيع."],
  [["منسوب", "مناسيب", "ميزان"], "المنسوب هو ارتفاع نقطة عن مستوى مرجعي. بيتقاس بجهاز الميزان (Level) أو التوتال ستيشن، وبيُستخدم في الحفر والردم وتحديد الميول."],
  [["توقيع"], "التوقيع هو نقل نقاط المشروع من المخطط إلى الأرض باستخدام إحداثياتها، زي المحاور والأعمدة والحدود."],
  [["رفع"], "الرفع المساحي هو قياس مواضع الأرض والمعالم ورسمها على خريطة بإحداثيات ومناسيب."],
  [["gps", "rtk", "جي بي"], "أجهزة GPS/RTK بتدّي دقة بالسنتيمترات في الظروف الجيدة، بس بتحتاج سماء مفتوحة وتصحيحات من قاعدة أو شبكة."],
  [["كميات", "حفر", "ردم"], "حساب الكميات بيعتمد على مناسيب الأرض الطبيعية ومناسيب التصميم، وحجم الحفر والردم بيطلع من الفرق بينهم."],
  [["تقسيم"], "تقسيم الأراضي بيشمل تحديد حدود كل قطعة وتوقيع نقاطها على الأرض حسب المخطط المعتمد."],
  [["سعر", "تكلفة", "كام"], "السعر بيتحدد حسب نوع الخدمة والمساحة والموقع. اطلب أخصائي مساحة وهنتفق على التفاصيل قبل بداية الشغل."],
  [["اطلب", "طلب", "ازاي"], "اضغط على «اطلب أخصائي مساحة»، املا نوع الخدمة وموقع الأرض، وهنتواصل معاك على واتساب."]
];
async function aiAnswer(q) {
  if (AI_ENDPOINT) {
    const r = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const j = await r.json(); return j.answer || "ممكن تعيد صياغة السؤال؟";
  }
  const t = q.toLowerCase();
  const hit = KB.find(([ks]) => ks.some(k => t.includes(k)));
  return hit ? hit[1] : "سؤال كويس. للتفاصيل الفنية الأعمق اطلب أخصائي مساحة من المنصة" + (WA_NUMBER ? "، أو كلّمنا على واتساب." : ".");
}

  const msgs = document.getElementById("msgs"), ci = document.getElementById("ci");
  const add = (who, t) => { const m = el("div", { class: "m " + who }, t); msgs.append(m); scrollTo(0, document.body.scrollHeight); return m; };
  add("bot", "أنا مساعدك الذكي في مجال المساحة. كيف يمكنني مساعدتك اليوم؟");
  const ask = async q => {

    try { w.textContent = await aiAnswer(q); } catch (e) { w.textContent = "حصلت مشكلة، جرّب تاني بعد شوية."; }
    scrollTo(0, document.body.scrollHeight);
  };
  ["إيه هو التوتال ستيشن؟", "يعني إيه مناسيب؟", "الفرق بين الرفع والتوقيع", "ازاي أطلب أخصائي مساحة؟"].forEach(t => {

  unsub = auth.onAuthStateChanged(u => {
    if (location.hash !== "#account") return;
    const adm = u && u.uid === ADMIN_UID;
    app.innerHTML = `<h2>حسابي</h2><div class="card">` + (u
      ? `<p>مسجّل دخول: <b id="who"></b></p><a class="btn p wide" href="${adm ? "#admin" : "#pro"}">${adm ? "لوحة التحكم" : "صفحة الأخصائي"}</a><button id="so" class="go">خروج</button>`
      : `<p>سجّل دخولك كأخصائي مساحة لتشوف الطلبات المتاحة.</p><a class="btn p wide" href="#pro">دخول الأخصائيين</a><a class="btn g wide" href="#surveyor">تسجيل أخصائي جديد</a>`) + `</div>`;
    if (u) { document.getElementById("who").textContent = u.email; document.getElementById("so").onclick = () => auth.signOut(); }
  });
}

function setNav(h) {
  const nav = document.getElementById("nav");
  nav.style.display = h === "admin" ? "none" : "flex";
  const it = (k, t, d, cls = "") => `<a href="#${k}" class="${cls} ${(h === k || (k === "account" && h === "pro")) ? "on" : ""}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${t}</a>`;
  nav.innerHTML = it("", "الرئيسية", IC.home) + it("ai", "GeoAI", IC.chip, "ai")
    + `<a href="#client" class="fab"><span class="c"><svg viewBox="0 0 24 24"><path d="${IC.plus}"/></svg></span>طلب جديد</a>`
    + it("my", "طلباتي", IC.clip) + it("account", "حسابي", IC.user);
}

function route() {
  const h = location.hash.slice(1);
  if (h === "client" || h === "surveyor") form(h);
  else if (h === "admin") admin();
  else if (h === "pro") pro();
  else if (h === "ai") ai();
  else if (h === "my") my();
  else if (h === "assistant") assistantForm();
  else if (h === "account") account();
  else home();
  app.className = ["client", "surveyor", "admin", "pro", "ai", "my", "account", "assistant"].includes(h) ? "page" : "";
  setNav(h);
  scrollTo(0, 0);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
