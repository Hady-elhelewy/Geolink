async function save(client, data) {
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  if (client) {
    const ref = db.collection("requests").doc(), b = db.batch();
    b.set(ref, { ...data, status: "new", createdAt: ts });
    b.set(db.collection("board").doc(ref.id), { service: data.service, gov: data.gov, status: "open", createdAt: ts });
    await b.commit();
  } else {
    const { email, pw, ...rest } = data;
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await db.collection("surveyors").doc(cred.user.uid).set({ ...rest, status: "new", createdAt: ts });
  }
}

async function adminPanel(user) {
  app.innerHTML = `<a class="back" href="#">رجوع</a><h2>لوحة التحكم</h2>
    <p>مسجّل دخول: <span id="who"></span> <button id="out" class="go" style="width:auto;margin:0 8px;padding:4px 14px;font-size:.9rem">خروج</button></p>
    <div class="tabs"><button id="t1" class="on">الطلبات</button><button id="t2">الأخصائيين</button><button id="t3">المساعدين</button></div>
    <div class="card" id="list">جاري التحميل...</div>`;
  document.getElementById("who").textContent = user.email;
  document.getElementById("out").onclick = () => auth.signOut();
  const list = document.getElementById("list");
  async function show(col) {
    list.textContent = "جاري التحميل...";
    try {
      const snap = await db.collection(col).orderBy("createdAt", "desc").get();
      const ap = col === "surveyors" ? new Set((await db.collection("approved").get()).docs.map(a => a.id)) : null;
      list.textContent = "";
      if (snap.empty) { list.textContent = "لسه مفيش بيانات."; return; }
      snap.forEach(d => {
        const x = d.data(), r = el("div", { class: "row" });
        const line = col === "requests"
          ? [x.service, x.gov, x.location] : col === "assistants" ? [x.skill, x.gov, `${x.years || 0} سنة خبرة`] : [x.spec, x.gov, `${x.years || 0} سنة خبرة`, x.gear];
        r.append(el("b", {}, x.name || "-"), " ", el("span", { class: "tag" }, (ap && ap.has(d.id)) ? "معتمد" : (x.status || "new")),
          el("div", {}, x.phone || ""), el("div", {}, line.filter(Boolean).join(" | ")));
        if (x.notes) r.append(el("p", {}, x.notes));
        const sel = el("select", {});
        sel.innerHTML = opts(["new","contacted","deposit-paid","done","rejected"]);
        sel.value = x.status || "new";
        sel.onchange = () => { d.ref.update({ status: sel.value }); if (col === "requests") db.collection("board").doc(d.id).update({ status: ["new", "contacted"].includes(sel.value) ? "open" : "closed" }).catch(() => {}); };
        r.append(sel);
        if (ap) {
          const ab = el("button", { class: "go", style: "margin-top:8px;padding:8px" }, ap.has(d.id) ? "إلغاء الاعتماد" : "اعتماد");
          ab.onclick = async () => {
            ab.disabled = true;
            try {
              const was = ap.has(d.id);
              if (was) await db.collection("approved").doc(d.id).delete();
              else await db.collection("approved").doc(d.id).set({ name: x.name || "", at: firebase.firestore.FieldValue.serverTimestamp() });
              if (x.gov) await db.collection("stats").doc("active").set({ [x.gov]: firebase.firestore.FieldValue.increment(was ? -1 : 1) }, { merge: true });
              statsP = null;
              show(col);
            } catch (e) { ab.textContent = "فشل، جرّب تاني"; }
          };
          r.append(ab);
        }
        list.append(r);
      });
    } catch (e) { list.textContent = "تعذر تحميل البيانات."; console.error(e); }
  }
  const tabsB = ["t1", "t2", "t3"].map(i => document.getElementById(i)), cols = ["requests", "surveyors", "assistants"];
  tabsB.forEach((b, i) => b.onclick = () => { tabsB.forEach(x => x.className = ""); b.className = "on"; show(cols[i]); });
  show("requests");
}

const KB = [
  [["اطلب", "طلب", "ازاي", "request", "order", "how to", "how do i"], "اضغط على «اطلب أخصائي مساحة»، املا نوع الخدمة وموقع الأرض، وهنتواصل معاك على واتساب."],

  [["gps", "rtk", "gnss", "جي بي"], "أجهزة GPS/RTK بتدّي دقة بالسنتيمترات في الظروف الجيدة، بس بتحتاج سماء مفتوحة وتصحيحات من قاعدة أو شبكة."],

];
async function aiAnswer(q) {
  if (AI_ENDPOINT) {
    const r = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const j = await r.json(); return j.answer || "ممكن تعيد صياغة السؤال؟";
  }
  const t = q.toLowerCase();
  const hit = KB.find(([ks]) => ks.some(k => t.includes(k)));
  return hit ? hit[1] : "سؤال كويس. للتفاصيل الفنية الأعمق اطلب أخصائي مساحة من المنصة" + (WA_NUMBER ? "، أو كلّمنا على واتساب." : ".");
}

const M_esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const M_svg = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const M_ini = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("");
const M_rate = p => p.ratingCount > 0 ? `★ ${(+p.ratingAvg).toFixed(1)} (${p.ratingCount})` : "جديد";
const M_when = t => t && t.toDate ? t.toDate().toLocaleDateString(LANG === "ar" ? "ar-EG" : "en-GB") : "";
const M_empty = (t, a = "") => `<div class="card done"><p>${t}</p>${a}</div>`;
const M_v = id => document.getElementById(id).value;
const M_card = (id, p) => `<a class="sp" href="#sp:${id}"><div class="av">${M_esc(M_ini(p.name))}</div><div class="si"><div class="sn"><b>${M_esc(p.name)}</b>${p.verified ? `<span class="vb" title="موثّق">${M_svg(IC.check)}</span>` : "<small>غير موثّق</small>"}</div><div class="sh2">${M_esc(p.headline)}</div><div class="sm">${M_esc(p.gov)} · ${+p.years} سنة خبرة</div><div class="cx">${(p.specs || []).slice(0, 3).map(x => `<span>${M_esc(x)}</span>`).join("")}</div><div class="sf"><span>${M_rate(p)}</span><span>${+p.completed || 0} مشروع</span><span class="${p.available ? "ok" : "no"}">${p.available ? "متاح" : "غير متاح"}</span></div></div></a>`;
function M_pager(col, order, render, filters, listId, moreId, emptyMsg) {
  let items = [], last = null;
  const list = document.getElementById(listId), more = document.getElementById(moreId);
  const draw = () => { const L = render(items); list.innerHTML = L || M_empty(items.length ? "مفيش نتائج بالفلاتر دي." : emptyMsg); };
  const load = async () => {
    try {
      let q = db.collection(col).orderBy(order, "desc").limit(20); if (last) q = q.startAfter(last);
      const snap = await q.get(); snap.forEach(d => items.push({ id: d.id, d: d.data() }));
      last = snap.docs[snap.docs.length - 1] || last; more.style.display = snap.size === 20 ? "block" : "none"; draw();
    } catch (e) { list.textContent = "تعذر تحميل البيانات. اتأكد إن قواعد Firebase محدّثة."; console.error(e); }
  };
  app.querySelectorAll("input,select").forEach(e => e.oninput = draw); more.onclick = load; load();
}

  p.innerHTML = `<div class="card">${cfg.modes.length > 1 ? seg("sg", cfg.modes, mm) : ""}${F.html}<p class="hint">${F.hint}</p><div class="bt"><button type="button" class="go" id="xc">احسب</button><button type="button" class="lnk" id="xe">تعبئة مثال</button><button type="button" class="lnk" id="xr">إعادة تعيين</button></div><div id="rs"><p class="hint">اضغط «احسب» لعرض النتائج.</p></div></div>`;
  if (cfg.modes.length > 1) wire("sg", k => xTool(p, cfg, k));
  const box = document.getElementById("rs"), ids = F.ids, val = () => Object.fromEntries(ids.map(i => [i, document.getElementById(i).value]));
  const run = () => { const r = cfg.calc(mm, val()); showRes(box, r === null ? "أكمل كل الحقول المطلوبة بقيم صحيحة." : r); };
  document.getElementById("xc").onclick = run;
  document.getElementById("xe").onclick = () => { Object.entries(F.ex).forEach(([k, v]) => { document.getElementById(k).value = v; }); run(); };
  document.getElementById("xr").onclick = () => { ids.forEach(i => { const e = document.getElementById(i); e.value = e.tagName === "SELECT" ? e.options[0].value : ""; }); box.innerHTML = `<p class="hint">اضغط «احسب» لعرض النتائج.</p>`; };
}

function toolPage(k) {
