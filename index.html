async function save(client, data) {
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  if (client) {
    const ref = db.collection("requests").doc(), b = db.batch();
    b.set(ref, { ...data, status: "new", createdAt: ts });
    b.set(db.collection("board").doc(ref.id), { service: data.service, gov: data.gov, status: "open", createdAt: ts });
    await b.commit();
  } else {
    const { email, pw, ...rest } = data;
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await db.collection("surveyors").doc(cred.user.uid).set({ ...rest, status: "new", createdAt: ts });
  }
}

function done(client, data) {
  const t = client ? `طلب أخصائي مساحة جديد من ${data.name} - ${data.service} - ${data.gov}` : `تسجيل أخصائي مساحة جديد: ${data.name} - ${data.spec} - ${data.gov}`;
  document.getElementById("f").outerHTML = `<div class="card done">
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>${client ? "وصل طلبك" : "تم تسجيلك"}</h2>

    ${WA_NUMBER ? `<a class="btn p wide" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">كمّل على واتساب</a>` : ""}

}

async function adminPanel(user) {
  app.innerHTML = `<a class="back" href="#">رجوع</a><h2>لوحة التحكم</h2>
    <p>مسجّل دخول: <span id="who"></span> <button id="out" class="go" style="width:auto;margin:0 8px;padding:4px 14px;font-size:.9rem">خروج</button></p>
    <div class="tabs"><button id="t1" class="on">الطلبات</button><button id="t2">الأخصائيين</button><button id="t3">المساعدين</button></div>
    <div class="card" id="list">جاري التحميل...</div>`;
  document.getElementById("who").textContent = user.email;
  document.getElementById("out").onclick = () => auth.signOut();
  const list = document.getElementById("list");
  async function show(col) {
    list.textContent = "جاري التحميل...";
    try {
      const snap = await db.collection(col).orderBy("createdAt", "desc").get();
      const ap = col === "surveyors" ? new Set((await db.collection("approved").get()).docs.map(a => a.id)) : null;
      list.textContent = "";
      if (snap.empty) { list.textContent = "لسه مفيش بيانات."; return; }
      snap.forEach(d => {
        const x = d.data(), r = el("div", { class: "row" });
        const line = col === "requests"
          ? [x.service, x.gov, x.location] : col === "assistants" ? [x.skill, x.gov, `${x.years || 0} سنة خبرة`] : [x.spec, x.gov, `${x.years || 0} سنة خبرة`, x.gear];
        r.append(el("b", {}, x.name || "-"), " ", el("span", { class: "tag" }, (ap && ap.has(d.id)) ? "معتمد" : (x.status || "new")),
          el("div", {}, x.phone || ""), el("div", {}, line.filter(Boolean).join(" | ")));
        if (x.notes) r.append(el("p", {}, x.notes));
        const sel = el("select", {});
        sel.innerHTML = opts(["new","contacted","deposit-paid","done","rejected"]);
        sel.value = x.status || "new";
        sel.onchange = () => { d.ref.update({ status: sel.value }); if (col === "requests") db.collection("board").doc(d.id).update({ status: ["new", "contacted"].includes(sel.value) ? "open" : "closed" }).catch(() => {}); };
        r.append(sel);
        if (ap) {
          const ab = el("button", { class: "go", style: "margin-top:8px;padding:8px" }, ap.has(d.id) ? "إلغاء الاعتماد" : "اعتماد");
          ab.onclick = async () => {
            ab.disabled = true;
            try {
              const was = ap.has(d.id);
              if (was) await db.collection("approved").doc(d.id).delete();
              else await db.collection("approved").doc(d.id).set({ name: x.name || "", at: firebase.firestore.FieldValue.serverTimestamp() });
              if (x.gov) await db.collection("stats").doc("active").set({ [x.gov]: firebase.firestore.FieldValue.increment(was ? -1 : 1) }, { merge: true });
              statsP = null;
              show(col);
            } catch (e) { ab.textContent = "فشل، جرّب تاني"; }
          };
          r.append(ab);
        }
        list.append(r);
      });
    } catch (e) { list.textContent = "تعذر تحميل البيانات."; console.error(e); }
  }
  const tabsB = ["t1", "t2", "t3"].map(i => document.getElementById(i)), cols = ["requests", "surveyors", "assistants"];
  tabsB.forEach((b, i) => b.onclick = () => { tabsB.forEach(x => x.className = ""); b.className = "on"; show(cols[i]); });
  show("requests");
}

async function aiAnswer(q) {
  if (AI_ENDPOINT) {
    const r = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const j = await r.json(); return j.answer || "ممكن تعيد صياغة السؤال؟";
  }
  const t = q.toLowerCase();
  const hit = KB.find(([ks]) => ks.some(k => t.includes(k)));
  return hit ? hit[1] : "سؤال كويس. للتفاصيل الفنية الأعمق اطلب أخصائي مساحة من المنصة" + (WA_NUMBER ? "، أو كلّمنا على واتساب." : ".");
}

const WGS = { a: 6378137, f: 1 / 298.257223563 };
WGS.e2 = WGS.f * (2 - WGS.f); WGS.ep2 = WGS.e2 / (1 - WGS.e2);

  const N = a / Math.sqrt(1 - e2 * sn * sn), T = tn * tn, C = ep2 * cs * cs, A = (rad(lon) - l0) * cs;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * p - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * p) + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * p) - (35 * e2 ** 3 / 3072) * Math.sin(6 * p));
  const E = 500000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);

}

    body = `<label for="t">${m === "en" ? "النقاط (E N)" : "النقاط (خط العرض، خط الطول)"}</label><textarea id="t" dir="ltr" placeholder="${m === "en" ? "500000 3000000&#10;500100 3000000&#10;500100 3000100&#10;500000 3000100" : "30.0000 31.0000&#10;30.0000 31.0010&#10;30.0010 31.0010&#10;30.0010 31.0000"}"></textarea>`
      + `<p class="hint">${m === "en" ? "كل سطر نقطة، وافصل بين E وN بمسافة أو فاصلة. رتّب النقاط بالتسلسل حول الحدود." : "كل سطر نقطة بالدرجات العشرية. تُحسب المساحة على مسقط UTM."}</p>`;
  }
  p.innerHTML = `<div class="card">${seg("sg", [["shape", "شكل هندسي"], ["en", "إحداثيات E,N"], ["ll", "إحداثيات جغرافية"]], m)}${body}<div id="rs"></div></div>`;
  wire("sg", k => areaTool(p, k));
  hook(ids, v => areaCompute(m, v), document.getElementById("rs"));
  if (m === "shape") document.getElementById("sh").onchange = e => areaTool(p, "shape", e.target.value);
}
function distTool(p, m = "pp") {
  const M = {
    pp: [["e1", "E1", "1000"], ["n1", "N1", "2000"], ["e2", "E2", "1100"], ["n2", "N2", "2100"], ["z1", "المنسوب 1 (اختياري)", "", "text"], ["z2", "المنسوب 2 (اختياري)", "", "text"]],
    pf: [["e1", "E1", "1000"], ["n1", "N1", "2000"], ["az", "الاتجاه Azimuth", "45 أو 45 30 0", "text"], ["d", "المسافة (م)", "100"]],
    geo: [["la1", "خط العرض 1", "30.0444", "text"], ["lo1", "خط الطول 1", "31.2357", "text"], ["la2", "خط العرض 2", "31.2001", "text"], ["lo2", "خط الطول 2", "29.9187", "text"]]
  }[m];
  const hints = { pp: "Azimuth = الزاوية من الشمال مع عقارب الساعة.", pf: "الاتجاه بالدرجات العشرية أو درجات ودقائق وثوانٍ.", geo: "المسافة على سطح الإهليلج WGS84 (طريقة Vincenty)." };
  p.innerHTML = `<div class="card">${seg("sg", [["pp", "بين نقطتين"], ["pf", "نقطة من مسافة واتجاه"], ["geo", "جغرافي"]], m)}`
    + M.map((f, i) => i % 2 ? "" : g2(fld(...f), M[i + 1] ? fld(...M[i + 1]) : "")).join("") + `<p class="hint">${hints[m]}</p><div id="rs"></div></div>`;
  wire("sg", k => distTool(p, k));
  hook(M.map(f => f[0]), v => distCompute(m, v), document.getElementById("rs"));
}
function unitTool(p, cat = "len") {
  const sl = cat === "slope";
  p.innerHTML = `<div class="card">${seg("sg", Object.entries(UN).map(([k, c]) => [k, c[0]]), cat)}`
    + (sl ? g2(fld("val", "القيمة", "", "text"), slc("st", "نوع القيمة", [["pct", "نسبة مئوية %"], ["deg", "درجات °"], ["ratio", "نسبة 1 : n (أدخل n)"]], "pct"))
      : g2(fld("val", "القيمة", "1"), slc("from", "من وحدة", UN[cat][1].map(([n], i) => [i, n]), 0)))
    + `<div id="rs"></div></div>`;
  wire("sg", k => unitTool(p, k));
  hook(sl ? ["val", "st"] : ["val", "from"], v => unitCompute(cat, v), document.getElementById("rs"));
}
function tools(k = "coord") {
  app.innerHTML = `<h2>الأدوات</h2><p style="margin:0 0 12px">حسابات مساحية سريعة تعمل مباشرة على جهازك.</p>`
    + `<div class="tl-grid">${Object.entries(TL).map(([id, [t, d]]) => `<button type="button" data-k="${id}" class="tl${id === k ? " on" : ""}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg><span>${t}</span></button>`).join("")}</div><div id="tp"></div>`;
  app.querySelector(".tl-grid").onclick = e => { const b = e.target.closest(".tl"); if (b) tools(b.dataset.k); };
  ({ coord: coordTool, area: areaTool, dist: distTool, unit: unitTool })[k](document.getElementById("tp"));
}


function route() {
  const h = location.hash.slice(1);
  if (h === "client" || h === "surveyor") form(h);
  else if (h === "admin") admin();
  else if (h === "pro") pro();
  else if (h === "ai") ai();
  else if (h === "tools") tools();
  else if (h === "my") my();
  else if (h === "jobs") jobsPage();
  else if (h === "specialists") specialistsPage();
  else if (h === "profile") profilePage();
  else if (/^sp:\w+$/.test(h)) specialistDetail(h.slice(3));
  else if (h === "assistant") assistantForm();
  else if (h === "account") account();
  else home();
  app.className = ["client", "surveyor", "admin", "pro", "ai", "my", "account", "assistant", "tools", "jobs", "specialists", "profile"].includes(h) || h.startsWith("sp:") ? "page" : "";
  setNav(h);
  scrollTo(0, 0);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
